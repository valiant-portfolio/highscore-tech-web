# Netlify build + runtime config for Highscore Tech.
# The official Next.js plugin (@netlify/plugin-nextjs) is auto-installed
# when Netlify detects a Next.js project, so we don't list it here.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund --legacy-peer-deps"

# -- Function timeouts -------------------------------------------------------
# Default Netlify free-tier limit is 26s. PDF generation routes hit the
# react-pdf renderer which can take a few seconds when warm.
[functions."api/staff/[slug]/contract.pdf"]
  timeout = 26

[functions."api/staff/[slug]/offer-letter.pdf"]
  timeout = 26

[functions."api/staff/[slug]/job-description.pdf"]
  timeout = 26

[functions."api/staff/[slug]/id-card.pdf"]
  timeout = 26

[functions."api/academy/[slug]/syllabus.pdf"]
  timeout = 26

[functions."api/payments/[id]/receipt.pdf"]
  timeout = 26

# -- Scheduled work has moved OFF Netlify ------------------------------------
# The Netlify scheduled functions (netlify/functions/cron-*.mjs) were removed to
# get off the Functions limit. Scheduled jobs now run entirely inside Supabase
# (pg_cron + Edge Functions). The old /api/cron/* routes are dormant until they
# are ported to Edge Functions, then deleted.

# -- Headers -----------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
